name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: event-registration-system/package-lock.json

      - name: Install dependencies
        working-directory: event-registration-system
        run: npm ci

      - name: Syntax check
        working-directory: event-registration-system
        run: |
          for f in server.js $(git ls-files '*.js' | grep -v '^node_modules/' | grep -v '^database/'); do
            node --check "$f"
          done

      - name: Test suite
        working-directory: event-registration-system
        # The suite pins DB_DIALECT/DB_STORAGE itself, so it always runs on an
        # in-memory SQLite database - never on a configured MySQL server.
        run: npm test
