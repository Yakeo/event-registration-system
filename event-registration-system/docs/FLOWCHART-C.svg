<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="'Segoe UI','DejaVu Sans',Arial,Helvetica,sans-serif">
<defs>
<style>
.t-term{fill:#fff;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.t-proc{fill:#1b2536;font-size:10.5px;font-weight:600}
.t-db{fill:#2f4f86;font-size:9.6px;font-weight:700;letter-spacing:.02em}
.t-ops{fill:#1b2536;font-size:8.7px}
.t-tbl{fill:#7a869c;font-size:7.6px}
.t-lab{fill:#5d6b85;font-size:8.8px}
.t-yes{fill:#0c6b4a;font-size:9px;font-weight:700}
.t-no{fill:#a52a3d;font-size:9px;font-weight:700}
.t-h1{fill:#1b2536;font-size:15px;font-weight:700}
.t-sub{fill:#5d6b85;font-size:8.8px}
.t-con{fill:#1b2536;font-size:9.5px;font-weight:700}
.t-leg{fill:#5d6b85;font-size:8.2px}
</style>
<marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 z" fill="#2b3a55"/></marker>
</defs>
<rect width="794" height="1123" fill="#ffffff"/>
<text class="t-h1" x="40" y="44">C · Sending the mail, and the guest manage link</text>
<text class="t-sub" x="40" y="61">Mail goes out in the background, so a broken mailbox never breaks a booking.</text>
<text class="t-sub" x="754" y="44" text-anchor="end">Sheet C of 3</text>
<line x1="40" y1="70" x2="754" y2="70" stroke="#dfe5ef"/>
<rect x="76.0" y="84" width="320" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="106.0" text-anchor="middle">Mail worker wakes up (every 15 s)</text>
<path d="M236 120 L236 127" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 134 A150.0 7 0 0 1 386.0 134 L386.0 188 A150.0 7 0 0 1 86.0 188 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 134 A150.0 7 0 0 0 386.0 134" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="149" text-anchor="middle">Mail waiting to go out</text>
<text class="t-tbl" x="236" y="162" text-anchor="middle">outgoing mail</text>
<text class="t-ops" x="236" y="181" text-anchor="middle">Takes the oldest messages first.</text>
<path d="M236 195 L236 202" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="86.0" y="202" width="300" height="44" rx="3" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="227.5" text-anchor="middle">Fills in the template, then sends it</text>
<path d="M236 246 L236 253" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 253 L361.0 286.0 L236 319 L111.0 286.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="283.5" text-anchor="middle">Did the mail service</text>
<text class="t-proc" x="236" y="295.5" text-anchor="middle">accept it?</text>
<path d="M356 286.0 L436 286.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-no" x="367" y="280.0" text-anchor="start">No</text>
<path d="M436.0 263.0 A170.0 7 0 0 1 776.0 263.0 L776.0 317.0 A170.0 7 0 0 1 436.0 317.0 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 263.0 A170.0 7 0 0 0 776.0 263.0" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="278.0" text-anchor="middle">Tries again later</text>
<text class="t-tbl" x="606" y="291.0" text-anchor="middle">outgoing mail</text>
<text class="t-ops" x="606" y="310.0" text-anchor="middle">Retries up to three times, then marks it failed.</text>
<text class="t-lab" x="606" y="378.0" text-anchor="middle">the Requeue button sends it again at once</text>
<path d="M236 319 L236 341" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-yes" x="228" y="334" text-anchor="end">Yes</text>
<path d="M86.0 348 A150.0 7 0 0 1 386.0 348 L386.0 402 A150.0 7 0 0 1 86.0 402 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 348 A150.0 7 0 0 0 386.0 348" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="363" text-anchor="middle">Marks it as sent</text>
<text class="t-tbl" x="236" y="376" text-anchor="middle">outgoing mail</text>
<text class="t-ops" x="236" y="395" text-anchor="middle">Notes that it went out, and when.</text>
<path d="M236 409 L236 416" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M85.0 416 L401.0 416 L387.0 460 L71.0 460 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="441.5" text-anchor="middle">Participant clicks the e-mailed link</text>
<circle cx="401" cy="438.0" r="12" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-con" x="401" y="441.5" text-anchor="middle">A</text>
<text class="t-lab" x="419" y="441.0" text-anchor="start">that link came from sheet A</text>
<path d="M236 460 L236 467" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 474 A150.0 7 0 0 1 386.0 474 L386.0 528 A150.0 7 0 0 1 86.0 528 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 474 A150.0 7 0 0 0 386.0 474" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="489" text-anchor="middle">Looks the link up</text>
<text class="t-tbl" x="236" y="502" text-anchor="middle">personal links and people</text>
<text class="t-ops" x="236" y="521" text-anchor="middle">Finds the person and booking; checks it is still valid.</text>
<path d="M236 535 L236 542" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 542 L361.0 575.0 L236 608 L111.0 575.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="572.5" text-anchor="middle">Which action did</text>
<text class="t-proc" x="236" y="584.5" text-anchor="middle">the link ask for?</text>
<path d="M236 608 L236 857" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 652.5 L432 652.5" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 630 L776.0 630 L776.0 665 Q691.0 653 606 665 Q521.0 677 436.0 665 Z" fill="#f7f9fc" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="606" y="647" text-anchor="middle">Sees the booking: event, date, place</text>
<text class="t-lab" x="252" y="646.5" text-anchor="start">view only</text>
<path d="M236 723.0 L432 723.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 696 A170.0 7 0 0 1 776.0 696 L776.0 750 A170.0 7 0 0 1 436.0 750 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 696 A170.0 7 0 0 0 776.0 696" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="711" text-anchor="middle">Cancels the booking</text>
<text class="t-tbl" x="606" y="724" text-anchor="middle">booking, history, mail</text>
<text class="t-ops" x="606" y="743" text-anchor="middle">Same as the signed-in page: seat freed, next one offered it.</text>
<text class="t-lab" x="252" y="717.0" text-anchor="start">cancel</text>
<path d="M236 805.0 L432 805.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 778 A170.0 7 0 0 1 776.0 778 L776.0 832 A170.0 7 0 0 1 436.0 832 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 778 A170.0 7 0 0 0 776.0 778" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="793" text-anchor="middle">Sets a password</text>
<text class="t-tbl" x="606" y="806" text-anchor="middle">people and their links</text>
<text class="t-ops" x="606" y="825" text-anchor="middle">Saves it and marks the link as used.</text>
<text class="t-lab" x="252" y="799.0" text-anchor="start">claim a password</text>
<rect x="136.0" y="857" width="200" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="879.0" text-anchor="middle">Done</text>
<line x1="40" y1="1006" x2="754" y2="1006" stroke="#dfe5ef"/>
<text class="t-leg" x="40" y="1022">Symbols (ISO 5807 / ANSI X3.5):</text>
<rect x="115" y="1034" width="34" height="16" rx="8" fill="#2b3a55"/>
<text class="t-leg" x="132" y="1066" text-anchor="middle">start / end</text>
<rect x="220" y="1034" width="32" height="16" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="236" y="1066" text-anchor="middle">process</text>
<path d="M330 1034 L358 1034 L350 1050 L322 1050 Z" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="340" y="1066" text-anchor="middle">input / output</text>
<path d="M429 1036 A15 4 0 0 1 459 1036 L459 1048 A15 4 0 0 1 429 1048 Z" fill="#eaf1fb" stroke="#2f4f86"/>
<text class="t-leg" x="444" y="1066" text-anchor="middle">stored data</text>
<path d="M548 1033 L567 1042 L548 1051 L529 1042 Z" fill="#fffdf3" stroke="#2b3a55"/>
<text class="t-leg" x="548" y="1066" text-anchor="middle">decision</text>
<rect x="636" y="1034" width="32" height="16" fill="#fff" stroke="#2b3a55"/><line x1="641" y1="1034" x2="641" y2="1050" stroke="#2b3a55"/><line x1="663" y1="1034" x2="663" y2="1050" stroke="#2b3a55"/>
<text class="t-leg" x="652" y="1066" text-anchor="middle">subroutine</text>
<path d="M740 1033 L772 1033 L772 1047 Q764 1039 756 1047 Q748 1055 740 1047 Z" fill="#f7f9fc" stroke="#2b3a55"/>
<text class="t-leg" x="756" y="1066" text-anchor="middle">document</text>
<circle cx="486" cy="1099" r="8" fill="#ffffff" stroke="#2b3a55" stroke-width="1.4"/>
<text class="t-leg" x="500" y="1102">off-page connector</text>
<text class="t-leg" x="40" y="1102">Online Event Registration System · sheet C of 3 · regenerate with python3 docs/generate-diagrams.py</text>
</svg>