</defs>
<rect width="794" height="1123" fill="#ffffff"/>
<text class="t-h1" x="40" y="44">C · Notification worker and guest self-service</text>
<text class="t-sub" x="40" y="61">Delivery runs out of band, so an SMTP failure can never roll back a booking.</text>
<text class="t-sub" x="754" y="44" text-anchor="end">Sheet C of 3</text>
<line x1="40" y1="70" x2="754" y2="70" stroke="#dfe5ef"/>
<rect x="86.0" y="84" width="300" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="106.0" text-anchor="middle">Worker timer fires (every 15 s)</text>
<path d="M236 120 L236 127" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 134 A150.0 7 0 0 1 386.0 134 L386.0 190 A150.0 7 0 0 1 86.0 190 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 134 A150.0 7 0 0 0 386.0 134" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="149" text-anchor="middle">NOTIFICATIONS</text>
<text class="t-ops" x="100.0" y="163">SELECT WHERE status = 'queued'</text>
<text class="t-ops" x="100.0" y="176">ORDER BY created_at LIMIT 20</text>
<path d="M236 197 L236 204" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="86.0" y="204" width="300" height="58" rx="3" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="229.5" text-anchor="middle">Renders the e-mail template, then sends it</text>
<text class="t-proc" x="236" y="243.5" text-anchor="middle">through the transport (console .eml / SMTP)</text>
<path d="M236 262 L236 269" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 269 L351.0 302.0 L236 335 L121.0 302.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="305.5" text-anchor="middle">Delivered?</text>
<path d="M351 302.0 L446 302.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-no" x="362" y="296.0" text-anchor="start">No</text>
<path d="M446.0 281.0 A160.0 7 0 0 1 766.0 281.0 L766.0 363.0 A160.0 7 0 0 1 446.0 363.0 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M446.0 281.0 A160.0 7 0 0 0 766.0 281.0" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="296.0" text-anchor="middle">NOTIFICATIONS</text>
<text class="t-ops" x="460.0" y="310.0">attempts = attempts + 1</text>
<text class="t-ops" x="460.0" y="323.0">requeue while attempts &lt; 3</text>
<text class="t-ops" x="460.0" y="336.0">then status = 'failed'</text>
<text class="t-ops" x="460.0" y="349.0">+ last_error (shown in /admin)</text>
<text class="t-lab" x="606" y="378.0" text-anchor="middle">Requeue button drains it immediately</text>
<path d="M236 335 L236 357" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-yes" x="228" y="350" text-anchor="end">Yes</text>
<path d="M86.0 364 A150.0 7 0 0 1 386.0 364 L386.0 420 A150.0 7 0 0 1 86.0 420 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 364 A150.0 7 0 0 0 386.0 364" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="379" text-anchor="middle">NOTIFICATIONS</text>
<text class="t-ops" x="100.0" y="393">UPDATE status = 'sent'</text>
<text class="t-ops" x="100.0" y="406">SET sent_at = NOW()</text>
<path d="M236 427 L236 434" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M100.0 434 L386.0 434 L372.0 478 L86.0 478 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="459.5" text-anchor="middle">Recipient opens /r/:token</text>
<circle cx="388" cy="456.0" r="12" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-con" x="388" y="459.5" text-anchor="middle">A</text>
<text class="t-lab" x="406" y="459.0" text-anchor="start">from sheet A</text>
<path d="M236 478 L236 485" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 492 A150.0 7 0 0 1 386.0 492 L386.0 548 A150.0 7 0 0 1 86.0 548 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 492 A150.0 7 0 0 0 386.0 492" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="507" text-anchor="middle">MANAGE_TOKENS</text>
<text class="t-ops" x="100.0" y="521">SELECT by token_hash = SHA-256(token)</text>
<text class="t-ops" x="100.0" y="534">JOIN USERS, REGISTRATIONS</text>
<path d="M236 555 L236 562" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 562 L351.0 595.0 L236 628 L121.0 595.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="592.5" text-anchor="middle">What does the</text>
<text class="t-proc" x="236" y="604.5" text-anchor="middle">guest do?</text>
<path d="M236 628 L236 928" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 672.5 L444 672.5" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M446.0 650 L766.0 650 L766.0 685 Q686.0 673 606 685 Q526.0 697 446.0 685 Z" fill="#f7f9fc" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="606" y="667" text-anchor="middle">Booking page: event, venue, seats</text>
<text class="t-lab" x="438" y="668.5" text-anchor="end">view</text>
<text class="t-lab" x="446" y="643" text-anchor="start">views the booking</text>
<path d="M236 765.5 L444 765.5" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M446.0 718 A160.0 7 0 0 1 766.0 718 L766.0 813 A160.0 7 0 0 1 446.0 813 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M446.0 718 A160.0 7 0 0 0 766.0 718" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="733" text-anchor="middle">REGISTRATIONS / STATUS_CHANGES</text>
<text class="t-ops" x="460.0" y="747">cancelRegistration()</text>
<text class="t-ops" x="460.0" y="760">UPDATE status = 'cancelled'</text>
<text class="t-ops" x="460.0" y="773">INSERT status change</text>
<text class="t-ops" x="460.0" y="786">promote next waitlisted (FIFO)</text>
<text class="t-ops" x="460.0" y="799">INSERT NOTIFICATIONS ('queued')</text>
<text class="t-lab" x="438" y="761.5" text-anchor="end">cancel</text>
<text class="t-lab" x="446" y="704" text-anchor="start">cancels it · promotes the next waitlisted participant</text>
<path d="M236 871.0 L444 871.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M446.0 843 A160.0 7 0 0 1 766.0 843 L766.0 899 A160.0 7 0 0 1 446.0 899 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M446.0 843 A160.0 7 0 0 0 766.0 843" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="858" text-anchor="middle">USERS / MANAGE_TOKENS</text>
<text class="t-ops" x="460.0" y="872">UPDATE password + claimed_at</text>
<text class="t-ops" x="460.0" y="885">UPDATE used_at (consume link)</text>
<text class="t-lab" x="438" y="867.0" text-anchor="end">claim</text>
<text class="t-lab" x="446" y="829" text-anchor="start">sets a password (optional)</text>
<rect x="136.0" y="928" width="200" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="950.0" text-anchor="middle">End</text>
<line x1="40" y1="1006" x2="754" y2="1006" stroke="#dfe5ef"/>
<text class="t-leg" x="40" y="1022">Symbols (ISO 5807 / ANSI X3.5):</text>
<rect x="115" y="1034" width="34" height="16" rx="8" fill="#2b3a55"/>
<text class="t-leg" x="132" y="1066" text-anchor="middle">start / end</text>
<rect x="220" y="1034" width="32" height="16" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="236" y="1066" text-anchor="middle">process</text>
<path d="M330 1034 L358 1034 L350 1050 L322 1050 Z" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="340" y="1066" text-anchor="middle">input / output</text>
