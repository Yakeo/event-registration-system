<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="'Segoe UI','DejaVu Sans',Arial,Helvetica,sans-serif">
<defs>
<style>
.t-term{fill:#fff;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.t-proc{fill:#1b2536;font-size:10.5px;font-weight:600}
.t-db{fill:#2f4f86;font-size:9.6px;font-weight:700;letter-spacing:.02em}
.t-ops{fill:#1b2536;font-size:8.7px}
.t-tbl{fill:#7a869c;font-size:7.6px}
.t-lab{fill:#5d6b85;font-size:8.8px}
.t-yes{fill:#0c6b4a;font-size:9px;font-weight:700}
.t-no{fill:#a52a3d;font-size:9px;font-weight:700}
.t-h1{fill:#1b2536;font-size:15px;font-weight:700}
.t-sub{fill:#5d6b85;font-size:8.8px}
.t-con{fill:#1b2536;font-size:9.5px;font-weight:700}
.t-leg{fill:#5d6b85;font-size:8.2px}
</style>
<marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 z" fill="#2b3a55"/></marker>
</defs>
<rect width="794" height="1123" fill="#ffffff"/>
<text class="t-h1" x="40" y="44">C · Sending the mail, and the guest manage link</text>
<text class="t-sub" x="40" y="61">Mail goes out in the background, so a broken mailbox never breaks a booking.</text>
<text class="t-sub" x="754" y="44" text-anchor="end">Sheet C of 3</text>
<line x1="40" y1="70" x2="754" y2="70" stroke="#dfe5ef"/>
<rect x="76.0" y="84" width="320" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="106.0" text-anchor="middle">Mail worker wakes up (every 15 s)</text>
<path d="M236 120 L236 127" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 134 A150.0 7 0 0 1 386.0 134 L386.0 201 A150.0 7 0 0 1 86.0 201 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 134 A150.0 7 0 0 0 386.0 134" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="149" text-anchor="middle">Mail waiting to go out</text>
<text class="t-tbl" x="236" y="162" text-anchor="middle">outgoing mail</text>
<text class="t-ops" x="236" y="181" text-anchor="middle">Takes the next few messages that</text>
<text class="t-ops" x="236" y="194" text-anchor="middle">are still waiting, oldest first.</text>
<path d="M236 208 L236 215" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="86.0" y="215" width="300" height="58" rx="3" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="240.5" text-anchor="middle">Fills in the message template, then hands</text>
<text class="t-proc" x="236" y="254.5" text-anchor="middle">it to the mail service (files or a server)</text>
<path d="M236 273 L236 280" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 280 L356.0 313.0 L236 346 L116.0 313.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="316.5" text-anchor="middle">Did it go out?</text>
<path d="M356 313.0 L436 313.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-no" x="367" y="307.0" text-anchor="start">No</text>
<path d="M436.0 290.0 A170.0 7 0 0 1 776.0 290.0 L776.0 383.0 A170.0 7 0 0 1 436.0 383.0 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 290.0 A170.0 7 0 0 0 776.0 290.0" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="305.0" text-anchor="middle">Tries again later</text>
<text class="t-tbl" x="606" y="318.0" text-anchor="middle">outgoing mail</text>
<text class="t-ops" x="606" y="337.0" text-anchor="middle">Notes the failed attempt and tries</text>
<text class="t-ops" x="606" y="350.0" text-anchor="middle">again, up to three times. After that it</text>
<text class="t-ops" x="606" y="363.0" text-anchor="middle">is marked as failed, with the reason</text>
<text class="t-ops" x="606" y="376.0" text-anchor="middle">kept so the organizer can see it.</text>
<text class="t-lab" x="606" y="405.0" text-anchor="middle">the Requeue button sends it again at once</text>
<path d="M236 346 L236 368" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-yes" x="228" y="361" text-anchor="end">Yes</text>
<path d="M86.0 375 A150.0 7 0 0 1 386.0 375 L386.0 442 A150.0 7 0 0 1 86.0 442 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 375 A150.0 7 0 0 0 386.0 375" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="390" text-anchor="middle">Marks it as sent</text>
<text class="t-tbl" x="236" y="403" text-anchor="middle">outgoing mail</text>
<text class="t-ops" x="236" y="422" text-anchor="middle">Notes that the message went out,</text>
<text class="t-ops" x="236" y="435" text-anchor="middle">and when.</text>
<path d="M236 449 L236 456" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M85.0 456 L401.0 456 L387.0 500 L71.0 500 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="481.5" text-anchor="middle">Participant clicks the link in the e-mail</text>
<circle cx="401" cy="478.0" r="12" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-con" x="401" y="481.5" text-anchor="middle">A</text>
<text class="t-lab" x="419" y="481.0" text-anchor="start">that link came from sheet A</text>
<path d="M236 500 L236 507" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 514 A150.0 7 0 0 1 386.0 514 L386.0 594 A150.0 7 0 0 1 86.0 594 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 514 A150.0 7 0 0 0 386.0 514" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="529" text-anchor="middle">Looks the link up</text>
<text class="t-tbl" x="236" y="542" text-anchor="middle">personal links and people</text>
<text class="t-ops" x="236" y="561" text-anchor="middle">Finds the link, the person and the</text>
<text class="t-ops" x="236" y="574" text-anchor="middle">booking. Checks it has not expired</text>
<text class="t-ops" x="236" y="587" text-anchor="middle">and has not been used already.</text>
<path d="M236 601 L236 608" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 608 L356.0 641.0 L236 674 L116.0 641.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="638.5" text-anchor="middle">What do they</text>
<text class="t-proc" x="236" y="650.5" text-anchor="middle">want to do?</text>
<path d="M236 674 L236 975" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 718.5 L432 718.5" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 696 L776.0 696 L776.0 731 Q691.0 719 606 731 Q521.0 743 436.0 731 Z" fill="#f7f9fc" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="606" y="713" text-anchor="middle">Sees the booking: event, date, place, seats left</text>
<text class="t-lab" x="434" y="713.5" text-anchor="end">look</text>
<text class="t-lab" x="448" y="689" text-anchor="start">just looks</text>
<path d="M236 802.0 L432 802.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 762 A170.0 7 0 0 1 776.0 762 L776.0 842 A170.0 7 0 0 1 436.0 842 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 762 A170.0 7 0 0 0 776.0 762" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="777" text-anchor="middle">Cancels the booking</text>
<text class="t-tbl" x="606" y="790" text-anchor="middle">booking, history, outgoing mail</text>
<text class="t-ops" x="606" y="809" text-anchor="middle">The same cancellation as the signed-in</text>
<text class="t-ops" x="606" y="822" text-anchor="middle">page: the seat is freed and offered to</text>
<text class="t-ops" x="606" y="835" text-anchor="middle">the next person waiting.</text>
<text class="t-lab" x="434" y="797.0" text-anchor="end">cancel</text>
<text class="t-lab" x="448" y="748" text-anchor="start">cancels</text>
<path d="M236 910.0 L432 910.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 870 A170.0 7 0 0 1 776.0 870 L776.0 950 A170.0 7 0 0 1 436.0 950 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 870 A170.0 7 0 0 0 776.0 870" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="885" text-anchor="middle">Sets a password</text>
<text class="t-tbl" x="606" y="898" text-anchor="middle">people and their links</text>
<text class="t-ops" x="606" y="917" text-anchor="middle">Saves the password, notes the day</text>
<text class="t-ops" x="606" y="930" text-anchor="middle">the account was claimed, and marks</text>
<text class="t-ops" x="606" y="943" text-anchor="middle">the link as used.</text>
<text class="t-lab" x="434" y="905.0" text-anchor="end">claim</text>
<text class="t-lab" x="448" y="856" text-anchor="start">turns the guest into an account</text>
<rect x="136.0" y="975" width="200" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="997.0" text-anchor="middle">Done</text>
<line x1="40" y1="1006" x2="754" y2="1006" stroke="#dfe5ef"/>
<text class="t-leg" x="40" y="1022">Symbols (ISO 5807 / ANSI X3.5):</text>
<rect x="115" y="1034" width="34" height="16" rx="8" fill="#2b3a55"/>
<text class="t-leg" x="132" y="1066" text-anchor="middle">start / end</text>
<rect x="220" y="1034" width="32" height="16" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="236" y="1066" text-anchor="middle">process</text>
<path d="M330 1034 L358 1034 L350 1050 L322 1050 Z" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="340" y="1066" text-anchor="middle">input / output</text>
<path d="M429 1036 A15 4 0 0 1 459 1036 L459 1048 A15 4 0 0 1 429 1048 Z" fill="#eaf1fb" stroke="#2f4f86"/>
<text class="t-leg" x="444" y="1066" text-anchor="middle">stored data</text>
<path d="M548 1033 L567 1042 L548 1051 L529 1042 Z" fill="#fffdf3" stroke="#2b3a55"/>
<text class="t-leg" x="548" y="1066" text-anchor="middle">decision</text>
<rect x="636" y="1034" width="32" height="16" fill="#fff" stroke="#2b3a55"/><line x1="641" y1="1034" x2="641" y2="1050" stroke="#2b3a55"/><line x1="663" y1="1034" x2="663" y2="1050" stroke="#2b3a55"/>
<text class="t-leg" x="652" y="1066" text-anchor="middle">subroutine</text>
<path d="M740 1033 L772 1033 L772 1047 Q764 1039 756 1047 Q748 1055 740 1047 Z" fill="#f7f9fc" stroke="#2b3a55"/>
<text class="t-leg" x="756" y="1066" text-anchor="middle">document</text>
<circle cx="486" cy="1099" r="8" fill="#ffffff" stroke="#2b3a55" stroke-width="1.4"/>
<text class="t-leg" x="500" y="1102">off-page connector</text>
<text class="t-leg" x="40" y="1102">Online Event Registration System · sheet C of 3 · regenerate with python3 docs/generate-diagrams.py</text>
</svg>