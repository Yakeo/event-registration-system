<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="'Segoe UI','DejaVu Sans',Arial,Helvetica,sans-serif">
<defs>
<style>
.t-term{fill:#fff;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.t-proc{fill:#1b2536;font-size:10.5px;font-weight:600}
.t-db{fill:#2f4f86;font-size:9.6px;font-weight:700;letter-spacing:.02em}
.t-ops{fill:#1b2536;font-size:8.7px}
.t-tbl{fill:#7a869c;font-size:7.6px}
.t-lab{fill:#5d6b85;font-size:8.8px}
.t-yes{fill:#0c6b4a;font-size:9px;font-weight:700}
.t-no{fill:#a52a3d;font-size:9px;font-weight:700}
.t-h1{fill:#1b2536;font-size:15px;font-weight:700}
.t-sub{fill:#5d6b85;font-size:8.8px}
.t-con{fill:#1b2536;font-size:9.5px;font-weight:700}
.t-leg{fill:#5d6b85;font-size:8.2px}
</style>
<marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 z" fill="#2b3a55"/></marker>
</defs>
<rect width="794" height="1123" fill="#ffffff"/>
<text class="t-h1" x="40" y="44">B · Administration — what the organizer does</text>
<text class="t-sub" x="40" y="61">Sign in, read the counters, then edit an event, check people in, or change a booking.</text>
<text class="t-sub" x="754" y="44" text-anchor="end">Sheet B of 3</text>
<line x1="40" y1="70" x2="754" y2="70" stroke="#dfe5ef"/>
<rect x="96.0" y="84" width="280" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="106.0" text-anchor="middle">Organizer opens the dashboard</text>
<path d="M236 120 L236 128" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 128 L356.0 161.0 L236 194 L116.0 161.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="158.5" text-anchor="middle">Already signed in</text>
<text class="t-proc" x="236" y="170.5" text-anchor="middle">as an organizer?</text>
<path d="M356 161.0 L436 161.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-no" x="367" y="155.0" text-anchor="start">No</text>
<path d="M450.0 141.0 L776.0 141.0 L762.0 185.0 L436.0 185.0 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="606" y="166.5" text-anchor="middle">Types e-mail and password</text>
<path d="M606 185.0 L606 197.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 204.0 A170.0 7 0 0 1 776.0 204.0 L776.0 284.0 A170.0 7 0 0 1 436.0 284.0 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 204.0 A170.0 7 0 0 0 776.0 204.0" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="219.0" text-anchor="middle">Checks the password</text>
<text class="t-tbl" x="606" y="232.0" text-anchor="middle">people</text>
<text class="t-ops" x="606" y="251.0" text-anchor="middle">Finds the account and compares the</text>
<text class="t-ops" x="606" y="264.0" text-anchor="middle">typed password with the one kept</text>
<text class="t-ops" x="606" y="277.0" text-anchor="middle">on file.</text>
<path d="M606 291.0 L606 303.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 310.0 A170.0 7 0 0 1 776.0 310.0 L776.0 377.0 A170.0 7 0 0 1 436.0 377.0 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 310.0 A170.0 7 0 0 0 776.0 310.0" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="325.0" text-anchor="middle">Remembers the visit</text>
<text class="t-tbl" x="606" y="338.0" text-anchor="middle">sign-ins</text>
<text class="t-ops" x="606" y="357.0" text-anchor="middle">Keeps them signed in, so the next</text>
<text class="t-ops" x="606" y="370.0" text-anchor="middle">page does not ask again.</text>
<path d="M606 384.0 L606 396.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="456.0" y="396.0" width="300" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="606" y="418.0" text-anchor="middle">Lands on the dashboard</text>
<path d="M236 194 L236 216" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-yes" x="229" y="209" text-anchor="end">Yes</text>
<path d="M100.0 216 L386.0 216 L372.0 260 L86.0 260 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="241.5" text-anchor="middle">Reads the dashboard</text>
<path d="M236 260 L236 268" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 275 A150.0 7 0 0 1 386.0 275 L386.0 355 A150.0 7 0 0 1 86.0 355 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 275 A150.0 7 0 0 0 386.0 275" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="290" text-anchor="middle">Summary counters</text>
<text class="t-tbl" x="236" y="303" text-anchor="middle">events, bookings, attendance</text>
<text class="t-ops" x="236" y="322" text-anchor="middle">Counts the events, the booked seats,</text>
<text class="t-ops" x="236" y="335" text-anchor="middle">the people waiting and who has</text>
<text class="t-ops" x="236" y="348" text-anchor="middle">arrived so far.</text>
<path d="M236 362 L236 370" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 370 L356.0 403.0 L236 436 L116.0 403.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="400.5" text-anchor="middle">What does the</text>
<text class="t-proc" x="236" y="412.5" text-anchor="middle">organizer do?</text>
<path d="M236 436 L236 873" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 529.0 L434 529.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 489 A170.0 7 0 0 1 776.0 489 L776.0 569 A170.0 7 0 0 1 436.0 569 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 489 A170.0 7 0 0 0 776.0 489" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="504" text-anchor="middle">Edits an event</text>
<text class="t-tbl" x="606" y="517" text-anchor="middle">events and venues</text>
<text class="t-ops" x="606" y="536" text-anchor="middle">Saves a new or changed event and</text>
<text class="t-ops" x="606" y="549" text-anchor="middle">its place — or puts it away, which</text>
<text class="t-ops" x="606" y="562" text-anchor="middle">hides it from the public list.</text>
<text class="t-lab" x="434" y="524.0" text-anchor="end">event</text>
<text class="t-lab" x="448" y="475" text-anchor="start">works on an event</text>
<path d="M236 662.5 L434 662.5" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 629 A170.0 7 0 0 1 776.0 629 L776.0 696 A170.0 7 0 0 1 436.0 696 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 629 A170.0 7 0 0 0 776.0 629" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="644" text-anchor="middle">Checks someone in</text>
<text class="t-tbl" x="606" y="657" text-anchor="middle">attendance and its history</text>
<text class="t-ops" x="606" y="676" text-anchor="middle">Marks the person as arrived, and</text>
<text class="t-ops" x="606" y="689" text-anchor="middle">notes who did the check-in.</text>
<text class="t-lab" x="434" y="657.5" text-anchor="end">check-in</text>
<text class="t-lab" x="448" y="615" text-anchor="start">works on attendance</text>
<path d="M236 796.0 L434 796.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 756 A170.0 7 0 0 1 776.0 756 L776.0 836 A170.0 7 0 0 1 436.0 836 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 756 A170.0 7 0 0 0 776.0 756" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="771" text-anchor="middle">Cancels or changes a booking</text>
<text class="t-tbl" x="606" y="784" text-anchor="middle">booking, history, outgoing mail</text>
<text class="t-ops" x="606" y="803" text-anchor="middle">Moves or cancels the booking, notes</text>
<text class="t-ops" x="606" y="816" text-anchor="middle">the change, and offers the freed</text>
<text class="t-ops" x="606" y="829" text-anchor="middle">seat to the next person waiting.</text>
<text class="t-lab" x="434" y="791.0" text-anchor="end">booking</text>
<text class="t-lab" x="448" y="742" text-anchor="start">works on a booking</text>
<rect x="121.0" y="873" width="230" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="895.0" text-anchor="middle">Change saved</text>
<text class="t-lab" x="236" y="927" text-anchor="middle">every change above is also kept in the history, and sends its message</text>
<line x1="40" y1="1006" x2="754" y2="1006" stroke="#dfe5ef"/>
<text class="t-leg" x="40" y="1022">Symbols (ISO 5807 / ANSI X3.5):</text>
<rect x="115" y="1034" width="34" height="16" rx="8" fill="#2b3a55"/>
<text class="t-leg" x="132" y="1066" text-anchor="middle">start / end</text>
<rect x="220" y="1034" width="32" height="16" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="236" y="1066" text-anchor="middle">process</text>
<path d="M330 1034 L358 1034 L350 1050 L322 1050 Z" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="340" y="1066" text-anchor="middle">input / output</text>
<path d="M429 1036 A15 4 0 0 1 459 1036 L459 1048 A15 4 0 0 1 429 1048 Z" fill="#eaf1fb" stroke="#2f4f86"/>
<text class="t-leg" x="444" y="1066" text-anchor="middle">stored data</text>
<path d="M548 1033 L567 1042 L548 1051 L529 1042 Z" fill="#fffdf3" stroke="#2b3a55"/>
<text class="t-leg" x="548" y="1066" text-anchor="middle">decision</text>
<rect x="636" y="1034" width="32" height="16" fill="#fff" stroke="#2b3a55"/><line x1="641" y1="1034" x2="641" y2="1050" stroke="#2b3a55"/><line x1="663" y1="1034" x2="663" y2="1050" stroke="#2b3a55"/>
<text class="t-leg" x="652" y="1066" text-anchor="middle">subroutine</text>
<path d="M740 1033 L772 1033 L772 1047 Q764 1039 756 1047 Q748 1055 740 1047 Z" fill="#f7f9fc" stroke="#2b3a55"/>
<text class="t-leg" x="756" y="1066" text-anchor="middle">document</text>
<circle cx="486" cy="1099" r="8" fill="#ffffff" stroke="#2b3a55" stroke-width="1.4"/>
<text class="t-leg" x="500" y="1102">off-page connector</text>
<text class="t-leg" x="40" y="1102">Online Event Registration System · sheet B of 3 · regenerate with python3 docs/generate-diagrams.py</text>
</svg>