<text class="t-tbl" x="606" y="605" text-anchor="middle">attendance and its history</text>
<text class="t-ops" x="606" y="624" text-anchor="middle">Marks them arrived, notes who did it.</text>
<text class="t-lab" x="434" y="599.0" text-anchor="end">check-in</text>
<text class="t-lab" x="448" y="563" text-anchor="start">works on attendance</text>
<path d="M236 718.0 L434 718.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 691 A170.0 7 0 0 1 776.0 691 L776.0 745 A170.0 7 0 0 1 436.0 745 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 691 A170.0 7 0 0 0 776.0 691" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="706" text-anchor="middle">Cancels or changes a booking</text>
<text class="t-tbl" x="606" y="719" text-anchor="middle">booking, history, mail</text>
<text class="t-ops" x="606" y="738" text-anchor="middle">Frees the seat and offers it to the next one waiting.</text>
<text class="t-lab" x="434" y="713.0" text-anchor="end">booking</text>
<text class="t-lab" x="448" y="677" text-anchor="start">works on a booking</text>
