<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="'Segoe UI','DejaVu Sans',Arial,Helvetica,sans-serif">
<defs>
<style>
.t-term{fill:#fff;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.t-proc{fill:#1b2536;font-size:10.5px;font-weight:600}
.t-db{fill:#2f4f86;font-size:9.6px;font-weight:700;letter-spacing:.02em}
.t-ops{fill:#1b2536;font-size:8.7px}
.t-tbl{fill:#6b7a99;font-family:'Consolas','DejaVu Sans Mono','Courier New',monospace;font-size:7.4px;letter-spacing:.06em}
.t-lab{fill:#5d6b85;font-size:8.8px}
.t-yes{fill:#0c6b4a;font-size:9px;font-weight:700}
.t-no{fill:#a52a3d;font-size:9px;font-weight:700}
.t-h1{fill:#1b2536;font-size:15px;font-weight:700}
.t-sub{fill:#5d6b85;font-size:8.8px}
.t-con{fill:#1b2536;font-size:9.5px;font-weight:700}
.t-leg{fill:#5d6b85;font-size:8.2px}
</style>
<marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 z" fill="#2b3a55"/></marker>
</defs>
<rect width="794" height="1123" fill="#ffffff"/>
<text class="t-h1" x="40" y="44">B · Administration — what the organizer does</text>
<text class="t-sub" x="40" y="61">Sign in, read the counters, then edit events, check people in, or change a booking.</text>
<text class="t-sub" x="754" y="44" text-anchor="end">Sheet B of 3</text>
<line x1="40" y1="70" x2="754" y2="70" stroke="#dfe5ef"/>
<rect x="96.0" y="84" width="280" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="106.0" text-anchor="middle">Organizer opens the dashboard</text>
<path d="M236 120 L236 129" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 129 L356.0 162.0 L236 195 L116.0 162.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="159.5" text-anchor="middle">Already signed in</text>
<text class="t-proc" x="236" y="171.5" text-anchor="middle">as an organizer?</text>
<path d="M356 162.0 L436 162.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-no" x="367" y="156.0" text-anchor="start">No</text>
<path d="M450.0 142.0 L776.0 142.0 L762.0 186.0 L436.0 186.0 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="606" y="167.5" text-anchor="middle">Types e-mail and password</text>
<path d="M606 186.0 L606 198.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 205.0 A170.0 7 0 0 1 776.0 205.0 L776.0 285.0 A170.0 7 0 0 1 436.0 285.0 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 205.0 A170.0 7 0 0 0 776.0 205.0" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="220.0" text-anchor="middle">Password check</text>
<text class="t-tbl" x="606" y="233.0" text-anchor="middle">USERS</text>
<text class="t-ops" x="606" y="252.0" text-anchor="middle">Finds the account by e-mail and</text>
<text class="t-ops" x="606" y="265.0" text-anchor="middle">compares the password with the</text>
<text class="t-ops" x="606" y="278.0" text-anchor="middle">stored hash.</text>
<path d="M606 292.0 L606 304.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 311.0 A170.0 7 0 0 1 776.0 311.0 L776.0 378.0 A170.0 7 0 0 1 436.0 378.0 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 311.0 A170.0 7 0 0 0 776.0 311.0" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="326.0" text-anchor="middle">Keeps them signed in</text>
<text class="t-tbl" x="606" y="339.0" text-anchor="middle">SESSIONS</text>
<text class="t-ops" x="606" y="358.0" text-anchor="middle">Remembers the session so the</text>
<text class="t-ops" x="606" y="371.0" text-anchor="middle">next page does not ask again.</text>
<path d="M606 385.0 L606 397.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="456.0" y="397.0" width="300" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="606" y="419.0" text-anchor="middle">Lands on the dashboard</text>
<path d="M236 195 L236 204" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-yes" x="242" y="204" text-anchor="start">Yes</text>
<path d="M100.0 204 L386.0 204 L372.0 248 L86.0 248 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="229.5" text-anchor="middle">Reads the dashboard</text>
<path d="M236 248 L236 257" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 264 A150.0 7 0 0 1 386.0 264 L386.0 344 A150.0 7 0 0 1 86.0 344 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 264 A150.0 7 0 0 0 386.0 264" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="279" text-anchor="middle">Summary counters</text>
<text class="t-tbl" x="236" y="292" text-anchor="middle">EVENTS · REGISTRATIONS</text>
<text class="t-ops" x="236" y="311" text-anchor="middle">Counts the events, the confirmed</text>
<text class="t-ops" x="236" y="324" text-anchor="middle">bookings, the waiting list and</text>
<text class="t-ops" x="236" y="337" text-anchor="middle">who has been checked in.</text>
<path d="M236 351 L236 360" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 360 L356.0 393.0 L236 426 L116.0 393.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="390.5" text-anchor="middle">What does the</text>
<text class="t-proc" x="236" y="402.5" text-anchor="middle">organizer do?</text>
<path d="M236 426 L236 863" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 519.0 L434 519.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 479 A170.0 7 0 0 1 776.0 479 L776.0 559 A170.0 7 0 0 1 436.0 559 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 479 A170.0 7 0 0 0 776.0 479" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="494" text-anchor="middle">Edits an event</text>
<text class="t-tbl" x="606" y="507" text-anchor="middle">EVENTS · VENUES</text>
<text class="t-ops" x="606" y="526" text-anchor="middle">Saves a new or changed event and</text>
<text class="t-ops" x="606" y="539" text-anchor="middle">its venue — or archives it, which</text>
<text class="t-ops" x="606" y="552" text-anchor="middle">hides it from the public list.</text>
<text class="t-lab" x="434" y="514.0" text-anchor="end">event</text>
<text class="t-lab" x="448" y="465" text-anchor="start">works on an event</text>
<path d="M236 652.5 L434 652.5" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 619 A170.0 7 0 0 1 776.0 619 L776.0 686 A170.0 7 0 0 1 436.0 686 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 619 A170.0 7 0 0 0 776.0 619" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="634" text-anchor="middle">Checks someone in</text>
<text class="t-tbl" x="606" y="647" text-anchor="middle">ATTENDANCE · AUDIT LOG</text>
<text class="t-ops" x="606" y="666" text-anchor="middle">Marks the participant as arrived</text>
<text class="t-ops" x="606" y="679" text-anchor="middle">and records who did the check-in.</text>
<text class="t-lab" x="434" y="647.5" text-anchor="end">check-in</text>
<text class="t-lab" x="448" y="605" text-anchor="start">works on attendance</text>
<path d="M236 786.0 L434 786.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M436.0 746 A170.0 7 0 0 1 776.0 746 L776.0 826 A170.0 7 0 0 1 436.0 826 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M436.0 746 A170.0 7 0 0 0 776.0 746" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="761" text-anchor="middle">Cancels or changes a booking</text>
<text class="t-tbl" x="606" y="774" text-anchor="middle">REGISTRATIONS + HISTORY + E-MAIL</text>
<text class="t-ops" x="606" y="793" text-anchor="middle">Cancels or moves the booking, notes</text>
<text class="t-ops" x="606" y="806" text-anchor="middle">the change, and offers the freed seat</text>
<text class="t-ops" x="606" y="819" text-anchor="middle">to the next person waiting.</text>
<text class="t-lab" x="434" y="781.0" text-anchor="end">booking</text>
<text class="t-lab" x="448" y="732" text-anchor="start">works on a booking</text>
<rect x="121.0" y="863" width="230" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="885.0" text-anchor="middle">Change saved</text>
<text class="t-lab" x="236" y="917" text-anchor="middle">every change above is also written to the audit log and queues its e-mail</text>
<line x1="40" y1="1006" x2="754" y2="1006" stroke="#dfe5ef"/>
<text class="t-leg" x="40" y="1022">Symbols (ISO 5807 / ANSI X3.5):</text>
<rect x="115" y="1034" width="34" height="16" rx="8" fill="#2b3a55"/>
<text class="t-leg" x="132" y="1066" text-anchor="middle">start / end</text>
<rect x="220" y="1034" width="32" height="16" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="236" y="1066" text-anchor="middle">process</text>
<path d="M330 1034 L358 1034 L350 1050 L322 1050 Z" fill="#fff" stroke="#2b3a55"/>
<text class="t-leg" x="340" y="1066" text-anchor="middle">input / output</text>
<path d="M429 1036 A15 4 0 0 1 459 1036 L459 1048 A15 4 0 0 1 429 1048 Z" fill="#eaf1fb" stroke="#2f4f86"/>
<text class="t-leg" x="444" y="1066" text-anchor="middle">stored data</text>
<path d="M548 1033 L567 1042 L548 1051 L529 1042 Z" fill="#fffdf3" stroke="#2b3a55"/>
<text class="t-leg" x="548" y="1066" text-anchor="middle">decision</text>
<rect x="636" y="1034" width="32" height="16" fill="#fff" stroke="#2b3a55"/><line x1="641" y1="1034" x2="641" y2="1050" stroke="#2b3a55"/><line x1="663" y1="1034" x2="663" y2="1050" stroke="#2b3a55"/>
<text class="t-leg" x="652" y="1066" text-anchor="middle">subroutine</text>
<path d="M740 1033 L772 1033 L772 1047 Q764 1039 756 1047 Q748 1055 740 1047 Z" fill="#f7f9fc" stroke="#2b3a55"/>
<text class="t-leg" x="756" y="1066" text-anchor="middle">document</text>
<circle cx="486" cy="1099" r="8" fill="#ffffff" stroke="#2b3a55" stroke-width="1.4"/>
<text class="t-leg" x="500" y="1102">off-page connector</text>
<text class="t-leg" x="40" y="1102">Online Event Registration System · sheet B of 3 · regenerate with python3 docs/generate-diagrams.py</text>
