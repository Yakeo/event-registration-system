<text class="t-tbl" x="606" y="491" text-anchor="middle">events and venues</text>
<text class="t-ops" x="606" y="510" text-anchor="middle">Saves it, or hides it from the public list.</text>
<text class="t-lab" x="434" y="485.0" text-anchor="end">event</text>
<text class="t-lab" x="448" y="449" text-anchor="start">works on an event</text>
