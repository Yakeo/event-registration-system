<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 720" width="1460" height="720" font-family="'Segoe UI',Arial,Helvetica,sans-serif">
<defs>
<linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#26407a"/><stop offset="100%" stop-color="#2f5bff"/></linearGradient>
<style>.ent-title{fill:#fff;font-size:18px;font-weight:700;letter-spacing:.06em}.fld{fill:#15203a;font-size:13.5px}.typ{fill:#6b7691;font-size:11px}.pk{fill:#b42b45;font-size:11px;font-weight:700}.fk{fill:#2440a8;font-size:11px;font-weight:700}.rel{fill:#15203a;font-size:14px;font-weight:700}.card{fill:#46527a;font-size:12.5px}.note{fill:#33406b;font-size:12.5px}.h1{fill:#15203a;font-size:23px;font-weight:700}.sub{fill:#6b7691;font-size:13px}</style>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#15203a" flood-opacity="0.13"/></filter>
</defs>
<rect width="1460" height="720" fill="#f5f7fb"/>
<text class="h1" x="30" y="52">Entity Relationship Diagram</text>
<text class="sub" x="30" y="76">Event Registration System &#183; USERS / EVENTS / REGISTRATIONS &#183; crow&#8217;s foot notation</text>
<g filter="url(#sh)">
<rect x="30" y="118" width="340" height="258" rx="12" fill="#fff" stroke="#dbe2f0"/>
<path d="M30 130 a12 12 0 0 1 12-12 h316 a12 12 0 0 1 12 12 v36 h-340 z" fill="url(#hd)"/>
<text class="ent-title" x="48" y="150">USERS</text>
</g>
<rect x="44" y="174" width="26" height="15" rx="4" fill="#fdeaee"/><text class="pk" x="51" y="185">PK</text>
<text class="fld" x="80" y="186">user_id</text>
<text class="typ" x="356" y="186" text-anchor="end">INT</text>
<line x1="30" y1="196" x2="370" y2="196" stroke="#eef1f8"/>
<text class="fld" x="80" y="216">full_name</text>
<text class="typ" x="356" y="216" text-anchor="end">VARCHAR(120)</text>
<line x1="30" y1="226" x2="370" y2="226" stroke="#eef1f8"/>
<text class="fld" x="80" y="246">email</text>
<text class="typ" x="356" y="246" text-anchor="end">VARCHAR(160) UNIQUE</text>
<line x1="30" y1="256" x2="370" y2="256" stroke="#eef1f8"/>
<text class="fld" x="80" y="276">password</text>
<text class="typ" x="356" y="276" text-anchor="end">VARCHAR(255) hashed</text>
<line x1="30" y1="286" x2="370" y2="286" stroke="#eef1f8"/>
<text class="fld" x="80" y="306">role</text>
<text class="typ" x="356" y="306" text-anchor="end">ENUM(admin|participant)</text>
<line x1="30" y1="316" x2="370" y2="316" stroke="#eef1f8"/>
<text class="fld" x="80" y="336">reset_password_token</text>
<text class="typ" x="356" y="336" text-anchor="end">VARCHAR(255) NULL</text>
<line x1="30" y1="346" x2="370" y2="346" stroke="#eef1f8"/>
<text class="fld" x="80" y="366">reset_password_expires</text>
<text class="typ" x="356" y="366" text-anchor="end">DATETIME NULL</text>
<g filter="url(#sh)">
<rect x="570" y="118" width="340" height="198" rx="12" fill="#fff" stroke="#dbe2f0"/>
<path d="M570 130 a12 12 0 0 1 12-12 h316 a12 12 0 0 1 12 12 v36 h-340 z" fill="url(#hd)"/>
<text class="ent-title" x="588" y="150">REGISTRATIONS</text>
</g>
<rect x="584" y="174" width="26" height="15" rx="4" fill="#fdeaee"/><text class="pk" x="591" y="185">PK</text>
<text class="fld" x="620" y="186">registration_id</text>
<text class="typ" x="896" y="186" text-anchor="end">INT</text>
<line x1="570" y1="196" x2="910" y2="196" stroke="#eef1f8"/>
<rect x="584" y="204" width="26" height="15" rx="4" fill="#e8eeff"/><text class="fk" x="591" y="215">FK</text>
<text class="fld" x="620" y="216">user_id</text>
<text class="typ" x="896" y="216" text-anchor="end">INT &#8594; USERS</text>
<line x1="570" y1="226" x2="910" y2="226" stroke="#eef1f8"/>
<rect x="584" y="234" width="26" height="15" rx="4" fill="#e8eeff"/><text class="fk" x="591" y="245">FK</text>
<text class="fld" x="620" y="246">event_id</text>
<text class="typ" x="896" y="246" text-anchor="end">INT &#8594; EVENTS</text>
<line x1="570" y1="256" x2="910" y2="256" stroke="#eef1f8"/>
<text class="fld" x="620" y="276">registration_date</text>
<text class="typ" x="896" y="276" text-anchor="end">DATETIME</text>
<line x1="570" y1="286" x2="910" y2="286" stroke="#eef1f8"/>
<text class="fld" x="620" y="306">status</text>
<text class="typ" x="896" y="306" text-anchor="end">ENUM(confirmed|waitlisted|cancelled)</text>
<g filter="url(#sh)">
<rect x="1110" y="118" width="340" height="228" rx="12" fill="#fff" stroke="#dbe2f0"/>
<path d="M1110 130 a12 12 0 0 1 12-12 h316 a12 12 0 0 1 12 12 v36 h-340 z" fill="url(#hd)"/>
<text class="ent-title" x="1128" y="150">EVENTS</text>
</g>
<rect x="1124" y="174" width="26" height="15" rx="4" fill="#fdeaee"/><text class="pk" x="1131" y="185">PK</text>
<text class="fld" x="1160" y="186">event_id</text>
<text class="typ" x="1436" y="186" text-anchor="end">INT</text>
<line x1="1110" y1="196" x2="1450" y2="196" stroke="#eef1f8"/>
<text class="fld" x="1160" y="216">title</text>
<text class="typ" x="1436" y="216" text-anchor="end">VARCHAR(180)</text>
<line x1="1110" y1="226" x2="1450" y2="226" stroke="#eef1f8"/>
<text class="fld" x="1160" y="246">description</text>
<text class="typ" x="1436" y="246" text-anchor="end">TEXT</text>
<line x1="1110" y1="256" x2="1450" y2="256" stroke="#eef1f8"/>
<text class="fld" x="1160" y="276">event_date</text>
<text class="typ" x="1436" y="276" text-anchor="end">DATETIME</text>
<line x1="1110" y1="286" x2="1450" y2="286" stroke="#eef1f8"/>
<text class="fld" x="1160" y="306">venue</text>
<text class="typ" x="1436" y="306" text-anchor="end">VARCHAR(180)</text>
<line x1="1110" y1="316" x2="1450" y2="316" stroke="#eef1f8"/>
<text class="fld" x="1160" y="336">max_participants</text>
<text class="typ" x="1436" y="336" text-anchor="end">INT</text>
<line x1="370" y1="211.0" x2="570" y2="211.0" stroke="#46527a" stroke-width="1.8"/>
<line x1="377" y1="200.0" x2="377" y2="222.0" stroke="#46527a" stroke-width="2"/>
<line x1="570" y1="198.0" x2="550" y2="211.0" stroke="#46527a" stroke-width="1.8"/>
<line x1="570" y1="224.0" x2="550" y2="211.0" stroke="#46527a" stroke-width="1.8"/>
<line x1="570" y1="211.0" x2="550" y2="211.0" stroke="#46527a" stroke-width="1.8"/>
<text class="rel" x="388" y="195.0">1</text>
<text class="rel" x="540" y="195.0" text-anchor="end">0..*</text>
<text class="card" x="470.0" y="243.0" text-anchor="middle">one user places</text>
<text class="card" x="470.0" y="259.0" text-anchor="middle">many registrations</text>
<line x1="910" y1="241.0" x2="1110" y2="241.0" stroke="#46527a" stroke-width="1.8"/>
<line x1="910" y1="228.0" x2="930" y2="241.0" stroke="#46527a" stroke-width="1.8"/>
<line x1="910" y1="254.0" x2="930" y2="241.0" stroke="#46527a" stroke-width="1.8"/>
<line x1="910" y1="241.0" x2="930" y2="241.0" stroke="#46527a" stroke-width="1.8"/>
<line x1="1103" y1="230.0" x2="1103" y2="252.0" stroke="#46527a" stroke-width="2"/>
<text class="rel" x="940" y="225.0">0..*</text>
<text class="rel" x="1092" y="225.0" text-anchor="end">1</text>
<text class="card" x="1010.0" y="273.0" text-anchor="middle">each registration</text>
<text class="card" x="1010.0" y="289.0" text-anchor="middle">is for one event</text>
<rect x="30" y="430" width="1400" height="106" rx="14" fill="#fff" stroke="#dbe2f0"/>
<text class="rel" x="60" y="466">[EVENTS]</text>
<text class="rel" x="152" y="466">1</text>
<line x1="168" y1="461" x2="268" y2="461" stroke="#46527a" stroke-width="1.8"/>
<text class="rel" x="284" y="466">0..*</text>
<text class="rel" x="332" y="466">[REGISTRATIONS]</text>
<text class="rel" x="514" y="466">0..*</text>
<line x1="556" y1="461" x2="656" y2="461" stroke="#46527a" stroke-width="1.8"/>
<text class="rel" x="672" y="466">1</text>
<text class="rel" x="694" y="466">[USERS]</text>
<text class="card" x="60" y="498">An EVENT has zero or many REGISTRATIONS, but each REGISTRATION is for exactly one EVENT.</text>
<text class="card" x="60" y="520">A USER has zero or many REGISTRATIONS, but each REGISTRATION belongs to exactly one USER.</text>
<rect x="30" y="554" width="1400" height="136" rx="14" fill="#e8eeff" stroke="#c6d3fb"/>
<text class="note" x="56" y="586"><tspan font-weight="700">Duplicate rule: </tspan>a composite UNIQUE index on REGISTRATIONS(event_id, user_id) guarantees one registration per email per event.</text>
<text class="note" x="56" y="610"><tspan font-weight="700">Capacity rule: </tspan>COUNT(REGISTRATIONS WHERE status = 'confirmed') &lt;= EVENTS.max_participants, enforced within transaction.</text>
<text class="note" x="56" y="634"><tspan font-weight="700">Password Reset: </tspan>USERS.reset_password_token stores a 64-character SHA-256 / crypto hex token with 1-hour expiration.</text>
<text class="note" x="56" y="658"><tspan font-weight="700">Referential Integrity: </tspan>REGISTRATIONS.user_id &#8594; USERS.user_id and REGISTRATIONS.event_id &#8594; EVENTS.event_id (ON DELETE CASCADE, ON UPDATE CASCADE).</text>
</svg>