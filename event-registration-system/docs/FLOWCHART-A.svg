<text class="t-db" x="236" y="208" text-anchor="middle">EVENTS ⋈ VENUES</text>
<text class="t-ops" x="100.0" y="222">SELECT events + venues</text>
<text class="t-ops" x="100.0" y="235">COUNT(*) WHERE status='confirmed'</text>
<text class="t-ops" x="100.0" y="248">remaining = max_participants - taken</text>
<path d="M236 269 L236 280" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M100.0 280 L386.0 280 L372.0 324 L86.0 324 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="305.5" text-anchor="middle">Selects one event  ( GET /events/:id )</text>
<path d="M236 324 L236 335" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 342 A150.0 7 0 0 1 386.0 342 L386.0 398 A150.0 7 0 0 1 86.0 398 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 342 A150.0 7 0 0 0 386.0 342" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="357" text-anchor="middle">EVENTS / REGISTRATIONS</text>
<text class="t-ops" x="100.0" y="371">SELECT event + venue</text>
<text class="t-ops" x="100.0" y="384">COUNT confirmed seats</text>
<path d="M236 405 L236 416" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M236 416 L351.0 449.0 L236 482 L121.0 449.0 Z" fill="#fffdf3" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="446.5" text-anchor="middle">Seats still</text>
<text class="t-proc" x="236" y="458.5" text-anchor="middle">available?</text>
<path d="M351 449.0 L446 449.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-no" x="362" y="443.0" text-anchor="start">No</text>
<path d="M450.0 431.0 L776.0 431.0 L762.0 475.0 L436.0 475.0 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="606" y="456.5" text-anchor="middle">Joins the waiting list  ( POST /events/:id/register )</text>
<path d="M606 475.0 L606 489.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M446.0 496.0 A160.0 7 0 0 1 766.0 496.0 L766.0 565.0 A160.0 7 0 0 1 446.0 565.0 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M446.0 496.0 A160.0 7 0 0 0 766.0 496.0" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="606" y="511.0" text-anchor="middle">REGISTRATIONS</text>
<text class="t-ops" x="460.0" y="525.0">INSERT status = 'waitlisted'</text>
<text class="t-ops" x="460.0" y="538.0">INSERT REGISTRATION_STATUS_CHANGES</text>
<text class="t-ops" x="460.0" y="551.0">INSERT NOTIFICATIONS ('queued')</text>
<path d="M606 572.0 L606 586.0" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="466.0" y="586.0" width="280" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="606" y="608.0" text-anchor="middle">On the waiting list</text>
<text class="t-lab" x="606" y="638.0" text-anchor="middle">promoted automatically when a seat frees up (sheet C)</text>
<path d="M236 482 L236 493" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="t-yes" x="242" y="491" text-anchor="start">Yes</text>
<path d="M100.0 493 L386.0 493 L372.0 537 L86.0 537 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="518.5" text-anchor="middle">Enters full name + e-mail address</text>
<path d="M236 537 L236 548" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 555 A150.0 7 0 0 1 386.0 555 L386.0 611 A150.0 7 0 0 1 86.0 611 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 555 A150.0 7 0 0 0 386.0 555" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="570" text-anchor="middle">USERS / REGISTRATIONS</text>
<text class="t-ops" x="100.0" y="584">SELECT WHERE (event_id, user_id)</text>
<text class="t-ops" x="100.0" y="597">validation + duplicate rule</text>
<path d="M236 618 L236 629" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 636 A150.0 7 0 0 1 386.0 636 L386.0 692 A150.0 7 0 0 1 86.0 692 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 636 A150.0 7 0 0 0 386.0 636" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="651" text-anchor="middle">EVENTS / REGISTRATIONS</text>
<text class="t-ops" x="100.0" y="665">SELECT event ... FOR UPDATE</text>
<text class="t-ops" x="100.0" y="678">COUNT confirmed (locked row)</text>
<path d="M236 699 L236 710" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 717 A150.0 7 0 0 1 386.0 717 L386.0 824 A150.0 7 0 0 1 86.0 824 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
<path d="M86.0 717 A150.0 7 0 0 0 386.0 717" fill="none" stroke="#2f4f86" stroke-width="1.1"/>
<text class="t-db" x="236" y="732" text-anchor="middle">REGISTRATIONS</text>
<text class="t-db" x="236" y="744" text-anchor="middle">STATUS_CHANGES · NOTIFICATIONS</text>
<text class="t-ops" x="100.0" y="758">BEGIN</text>
<text class="t-ops" x="100.0" y="771">INSERT registration</text>
<text class="t-ops" x="100.0" y="784">INSERT status history</text>
<text class="t-ops" x="100.0" y="797">INSERT notification ('queued')</text>
<text class="t-ops" x="100.0" y="810">COMMIT</text>
<path d="M236 831 L236 842" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="106.0" y="842" width="260" height="41" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<line x1="117.0" y1="842" x2="117.0" y2="883" stroke="#2b3a55" stroke-width="1.1"/>
<line x1="355.0" y1="842" x2="355.0" y2="883" stroke="#2b3a55" stroke-width="1.1"/>
<text class="t-proc" x="236" y="866.0" text-anchor="middle">notifyRegistration()</text>
<path d="M236 883 L236 894" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 894 L386.0 894 L386.0 929 Q311.0 917 236 929 Q161.0 941 86.0 929 Z" fill="#f7f9fc" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="911" text-anchor="middle">Confirmation page + e-mail with /r/:token</text>
