</style>
<marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 z" fill="#2b3a55"/></marker>
</defs>
<rect width="794" height="1123" fill="#ffffff"/>
<text class="t-h1" x="40" y="44">A · Participant — browse, register, confirm</text>
<text class="t-sub" x="40" y="61">Public pages. No account is needed: the e-mailed link is the credential.</text>
<text class="t-sub" x="754" y="44" text-anchor="end">Sheet A of 3</text>
<line x1="40" y1="70" x2="754" y2="70" stroke="#dfe5ef"/>
<rect x="126.0" y="84" width="220" height="36" rx="18.0" fill="#2b3a55"/>
<text class="t-term" x="236" y="106.0" text-anchor="middle">Start</text>
<path d="M236 120 L236 131" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M100.0 131 L386.0 131 L372.0 175 L86.0 175 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.5"/>
<text class="t-proc" x="236" y="156.5" text-anchor="middle">Opens the event list  ( GET / )</text>
<path d="M236 175 L236 186" fill="none" stroke="#2b3a55" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M86.0 193 A150.0 7 0 0 1 386.0 193 L386.0 262 A150.0 7 0 0 1 86.0 262 Z" fill="#eaf1fb" stroke="#2f4f86" stroke-width="1.4"/>
